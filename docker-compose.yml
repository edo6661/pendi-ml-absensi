services:
  app:
    build: .
    container_name: presensi-ai-web
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
      - DB_HOST=db
      - DB_NAME=skripsi_db
      - DB_USER=postgres
      - DB_PASS=12345
    depends_on:
      - db
    networks:
      - proxy-network
      - presensi-internal
  db:
    image: postgres:15-alpine
    container_name: presensi-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: skripsi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      TZ: Asia/Jakarta
    volumes:
      - presensi_db_data:/var/lib/postgresql/data
    networks:
      - presensi-internal
networks:
  proxy-network:
    external: true
  presensi-internal:
    driver: bridge
volumes:
  presensi_db_data:
